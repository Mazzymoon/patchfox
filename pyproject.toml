[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patchfox"
version = "0.4.0"
description = "Small local coding agent for OpenAI-compatible, Anthropic-compatible, and DeepSeek models"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0.0",
  "textual>=0.86.0",
  "tomli>=2.0.0; python_version < '3.11'",
  "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
swebench = [
  "datasets>=2.19.0",
]

[project.scripts]
patchfox = "patchfox.cli:main"
patchfox-tui = "patchfox.tui.main:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["patchfox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  ".git",
  ".patchfox",
  ".venv",
  ".worktrees",
  "_local",
  "artifacts",
  "build",
  "dist",
  "examples",
  "fixtures",
]
